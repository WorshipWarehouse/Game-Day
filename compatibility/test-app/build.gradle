plugins {
    id 'com.android.application'
}

android {
    namespace 'app.gameday.compat.test'
    compileSdk 34

    defaultConfig {
        applicationId 'app.gameday.compat.test'
        minSdk 25
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
        resConfigs 'en'
    }

    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            // The test app is a development instrument, not a distributed product.
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':core')
}
