pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'GameDay'

// Platform-independent logic and its JVM test suite.
include ':core'
// Runtime backend contract shared by Android (now) and macOS (later).
include ':runtime-api'
// Desktop/Apple-silicon runtime backend (Avo-class HVF VM) and host readiness verification.
include ':runtime:desktop'
// The Fire TV application.
include ':apps:fire-tv'
// Self-owned compatibility test application used to validate the runtime on device.
include ':compatibility:test-app'
